<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="flipkart.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <title>Online Shopping Site</title>
</head>

<body>

    <!-- Navbar -->
    <header>

        <nav class="top-nav">

            <div class="top-nav-left">

                <button class="btn active">
                    <i class="fa-solid fa-bag-shopping"></i>
                    Flipkart
                </button>

                <button class="btn">
                    <i class="fa-solid fa-plane"></i>
                    Travel
                </button>

            </div>

            <div class="top-nav-right">

                <i class="fa-solid fa-location-dot"></i>

                <p>Location : Vadodara</p>

            </div>

        </nav>

    </header>

    <main>

        <!-- Search Bar Section -->

        <section class="search-wrapper">

            <div class="search-box"></div>

            <div class="offer-box"></div>

        </section>

        <!-- Categories -->

        <section class="category-wrapper">

            <div class="category">Box 1</div>
            <div class="category">Box 2</div>
            <div class="category">Box 3</div>
            <div class="category">Box 4</div>
            <div class="category">Box 5</div>
            <div class="category">Box 6</div>
            <div class="category">Box 7</div>
            <div class="category">Box 8</div>
            <div class="category">Box 9</div>
            <div class="category">Box 10</div>
            <div class="category">Box 11</div>
            <div class="category">Box 12</div>
            <div class="category">Box 13</div>
            <div class="category">Box 14</div>

        </section>

        <!-- Ads Section -->

        <section class="ads-wrapper">

            <div class="ad-box">Ad Banner 1</div>

            <div class="ad-box">Ad Banner 2</div>

            <div class="ad-box">Ad Banner 3</div>

        </section>

    </main>

</body>

</html>
